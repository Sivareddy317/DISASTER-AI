plugins {
    id 'com.android.application'
}

android {
    namespace 'com.disasterai.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.disasterai.app"
        minSdk 24           // Android 7.0 — covers ~94% of active devices
        targetSdk 34
        versionCode 1
        versionName "2.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // For production: set minifyEnabled true and configure signing
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // No extra dependencies needed — pure WebView app
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
